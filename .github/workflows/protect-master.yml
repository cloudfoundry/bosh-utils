name: Release Branch Protection

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions: {}

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch
        if: github.event.pull_request.base.ref == 'master' || github.event.pull_request.base.ref == 'main'
        run: |
          echo "Error: Submit pull requests to develop instead of the release branch"
          exit 1